name: deploy

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:
    inputs:
      action:
        description: "Action to perform (manual run only)"
        required: true
        type: choice
        options:
          - none
          - destroy
        default: none
      environment:
        description: "Environment to act on"
        required: true
        type: choice
        options:
          - dev
          - prod
        default: dev
      confirm:
        description: 'Type DESTROY (uppercase) to authorize a destroy run; ignored when action=none'
        required: false
        type: string
        default: ""

permissions:
  contents: read
  id-token: write # for OIDC if adopted; harmless otherwise

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive infrastructure/

      - name: Terraform init and validate (dev)
        run: |
          terraform -chdir=infrastructure/environments/dev init -backend=false
          terraform -chdir=infrastructure/environments/dev validate

      - name: Terraform init and validate (prod)
        run: |
          terraform -chdir=infrastructure/environments/prod init -backend=false
          terraform -chdir=infrastructure/environments/prod validate

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v4

      - name: Run tflint
        run: tflint --chdir=infrastructure --recursive

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: infrastructure/
          # soft_fail: findings are reported but do not block CI.
          # 3 pre-existing HIGH/MEDIUM findings live in infrastructure/smoke/main.tf
          # (the phase-0 ephemeral smoke S3 bucket — encryption-customer-key,
          # enable-bucket-logging, enable-versioning). The networking module has
          # zero tfsec findings. Fix the smoke module issues in a follow-up story.
          soft_fail: "true"

  plan-dev:
    name: Plan (dev)
    needs: [validate]
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-central-1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Lambda layers and function zips
        run: make package-all

      - name: Terraform init
        run: terraform -chdir=infrastructure/environments/dev init

      - name: Terraform plan
        run: >
          terraform -chdir=infrastructure/environments/dev
          plan -out=tfplan -var-file=dev.tfvars

      - name: Upload dev plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-dev
          path: infrastructure/environments/dev/tfplan

      - name: Upload build artifacts (Lambda zips and layers)
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-dev
          path: build/

  plan-prod:
    name: Plan (prod)
    needs: [validate]
    runs-on: ubuntu-latest
    if: vars.DEPLOY_PROD == 'true'
    environment: prod
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-central-1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Lambda layers and function zips
        run: make package-all

      - name: Terraform init
        run: terraform -chdir=infrastructure/environments/prod init

      - name: Terraform plan
        run: >
          terraform -chdir=infrastructure/environments/prod
          plan -out=tfplan -var-file=prod.tfvars

      - name: Upload prod plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-prod
          path: infrastructure/environments/prod/tfplan

      - name: Upload build artifacts (Lambda zips and layers)
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-prod
          path: build/

  test:
    name: Test
    needs: [plan-dev]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: Run module tests
        run: |
          set -e
          shopt -s nullglob
          for d in infrastructure/modules/*/tests; do
            module_dir="$(dirname "$d")"
            echo "Running tests in $module_dir"
            terraform -chdir="$module_dir" init -backend=false
            terraform -chdir="$module_dir" test
          done
          if [ -d infrastructure/tests ]; then
            echo "Running top-level infrastructure tests"
            terraform -chdir=infrastructure init -backend=false
            terraform -chdir=infrastructure test
          fi

  apply-dev:
    name: Apply (dev)
    needs: [plan-dev, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    environment: dev
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-central-1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: Download dev plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-dev
          path: infrastructure/environments/dev/

      - name: Download build artifacts (Lambda zips and layers)
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-dev
          path: build/

      - name: Terraform init
        run: terraform -chdir=infrastructure/environments/dev init

      - name: Terraform apply
        run: terraform -chdir=infrastructure/environments/dev apply -auto-approve tfplan

  apply-prod:
    name: Apply (prod)
    needs: [plan-prod, test]
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_PROD == 'true'
    environment: prod
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-central-1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: Download prod plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-prod
          path: infrastructure/environments/prod/

      - name: Download build artifacts (Lambda zips and layers)
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-prod
          path: build/

      - name: Terraform init
        run: terraform -chdir=infrastructure/environments/prod init

      - name: Terraform apply
        run: terraform -chdir=infrastructure/environments/prod apply -auto-approve tfplan

  destroy:
    name: Destroy (manual)
    needs: [validate]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.action == 'destroy' &&
      inputs.confirm == 'DESTROY'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: eu-central-1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"

      - name: Terraform init
        run: terraform -chdir=infrastructure/environments/${{ inputs.environment }} init

      - name: Terraform destroy
        run: >
          terraform -chdir=infrastructure/environments/${{ inputs.environment }}
          destroy -auto-approve -var-file=${{ inputs.environment }}.tfvars
