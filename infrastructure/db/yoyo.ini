[DEFAULT]
# Default database URL points at the local docker-compose Postgres container.
# Override by passing --database on the command line, or by setting the
# YOYO_DATABASE environment variable, when targeting a different host.
database = postgresql://knotify:knotify@localhost:5432/knotify

sources = %(here)s/migrations

# yoyo stores its own tracking tables (_yoyo_migration, _yoyo_log, _yoyo_lock)
# in the public schema. Those tables are created automatically on first apply
# and are not part of the application schema.
batch_mode = off
verbosity = 1
