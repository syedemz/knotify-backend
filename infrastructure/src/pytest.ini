[pytest]
testpaths = .
python_files = test_*.py
# importlib mode prevents sys.modules collisions when two test directories each
# contain a module with the same basename (e.g. db_migrator/handler.py and
# cognito_post_confirmation/handler.py).  pytest's default "prepend" mode
# imports test files by bare module name, so the second collected handler.py
# shadows the first in sys.modules.  importlib mode imports each file by its
# full path, eliminating the collision entirely.
addopts = --import-mode=importlib
markers =
    integration: tests that require docker + the local Postgres container
